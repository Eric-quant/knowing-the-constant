name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            lmodern fonts-dejavu

      - name: Regenerate all figures from their scripts
        run: python scripts/make_figures.py

      - name: Style gate
        run: python scripts/check_style.py

      - name: Verify the claim registers are well formed
        run: python scripts/check_registers.py

      - name: Render HTML
        run: quarto render --to html

      - name: Render PDF
        run: quarto render --to pdf

      - name: Render EPUB
        run: quarto render --to epub

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp -r _book/* dist/ 2>/dev/null || true
          ls -la dist | head -40

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Gather release files
        run: |
          mkdir -p release
          find . -path ./.git -prune -o -type f \( -name '*.epub' -o -name '*.pdf' \) -print
          find . -path ./.git -prune -o -type f \( -name '*.epub' -o -name '*.pdf' \) -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: release/*
          generate_release_notes: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
